[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bangla-multiscript"
version = "1.0.0"
authors = [
  { name="Shahriar", email="shahriarhossain1837@gmail.com" },
]
description = "High-Throughput Bengali to Natural Avro Banglish & Urban Code-Mixed Alignment Engine"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
dependencies = [
    "pandas>=1.3.0",
    "tqdm>=4.60.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]

[project.optional-dependencies]
web = ["deep-translator>=1.11.0"]
indictrans2 = [
    "torch>=2.0.0",
    "transformers>=4.30.0",
    "IndicTransToolkit",
]
all = [
    "deep-translator>=1.11.0",
    "torch>=2.0.0",
    "transformers>=4.30.0",
    "IndicTransToolkit",
]

[tool.setuptools.package-data]
"bangla_multiscript" = ["web/*.html"]

[project.urls]
"Homepage" = "https://github.com/shahriar/BanglaMultiScript"
"Bug Tracker" = "https://github.com/shahriar/BanglaMultiScript/issues"

[project.scripts]
bangla-multiscript = "bangla_multiscript.cli:main"
